<div class="auth-page">

  <form
    class="auth-panel"
    [formGroup]="form"
    (ngSubmit)="login()">

    <h1>Login</h1>

    <div
      class="alert alert-danger"
      *ngIf="errorMessage">

      {{ errorMessage }}

    </div>

    <div class="mb-3">

      <label class="form-label">
        Username
      </label>

      <input
        class="form-control"
        formControlName="username"
        autocomplete="username">

    </div>

    <div class="mb-3">

      <label class="form-label">
        Password
      </label>

      <input
        class="form-control"
        type="password"
        formControlName="password"
        autocomplete="current-password">

    </div>

    <button
      class="btn btn-primary w-100"
      type="submit"
      [disabled]="form.invalid">

      Login

    </button>

  </form>

</div>
